<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>FunToy | Formulário de Brinquedo</title>
</head>
<body>
<div class="container">
    <div class="breadcrumb">
        <a href="/">Home</a><span class="sep">/</span>
        <a href="/listar">Brinquedos</a><span class="sep">/</span>
        <span th:text="${brinquedo.id == null} ? 'Adicionar' : 'Editar'">Form</span>
    </div>

    <div class="page-head">
        <h1 th:text="${brinquedo.id == null} ? '➕ Adicionar Brinquedo' : '✏️ Editar Brinquedo'"></h1>
        <p class="muted" th:text="${brinquedo.id == null} ? 'Preencha os campos para cadastrar um novo item.' : 'Atualize os dados e salve suas alterações.'"></p>
    </div>

    <div class="card">
        <form class="form" th:action="@{/salvar}" th:object="${brinquedo}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-row">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>

            <div class="form-row">
                <label for="tipo">Tipo</label>
                <input type="text" id="tipo" th:field="*{tipo}" required>
            </div>

            <div class="form-row">
                <label for="classificacao">Classificação</label>
                <input type="text" id="classificacao" th:field="*{classificacao}" required>
            </div>

            <div class="form-row">
                <label for="tamanho">Tamanho (cm)</label>
                <input type="number" step="0.01" id="tamanho" th:field="*{tamanho}" required>
            </div>

            <div class="form-row">
                <label for="preco">Preço</label>
                <input type="number" step="0.01" id="preco" th:field="*{preco}" required>
            </div>

            <div class="form-row">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" th:field="*{descricao}" required></textarea>
            </div>

            <div class="actions">
                <button type="submit" class="button">Salvar</button>
                <a href="/listar" class="button secondary">Cancelar</a>
                <button type="button" class="button ghost" onclick="history.back()">Voltar</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
