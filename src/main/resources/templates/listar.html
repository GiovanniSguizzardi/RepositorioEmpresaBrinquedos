<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>FunToy | Lista de Brinquedos</title>
</head>
<body>
<div class="container">
    <div class="breadcrumb">
        <a href="/">Home</a><span class="sep">/</span>
        <span>Brinquedos</span>
    </div>

    <div class="page-head">
        <h1>📝 Lista de Brinquedos</h1>
        <p class="muted">Gerencie seus itens cadastrados.</p>
    </div>

    <ul class="list">
        <th:block th:each="brinquedo : ${brinquedos}">
            <li class="list-item">
                <div class="list-item-title" th:text="${brinquedo.nome}">Nome do brinquedo</div>
                <div class="actions">
                    <a th:href="@{/descricao/{id}(id=${brinquedo.id})}" class="button">Descrição</a>
                    <a th:href="@{/editar/{id}(id=${brinquedo.id})}" class="button">Editar</a>
                    <form th:action="@{/excluir/{id}(id=${brinquedo.id})}" method="post" style="display:inline;">
                        <button type="submit" class="button danger"
                                onclick="return confirm('Tem certeza que deseja excluir este brinquedo?');">Excluir</button>
                    </form>
                </div>
            </li>
        </th:block>
    </ul>

    <div class="actions" style="margin-top:16px">
        <a href="/adicionar" class="button">Adicionar Brinquedo</a>
        <a href="/" class="button ghost">Home</a>
    </div>
</div>
</body>
</html>
